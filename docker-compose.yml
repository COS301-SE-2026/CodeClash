services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_URL=${REDIS_URL}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - COGNITO_REGION=${COGNITO_REGION}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - COGNITO_JWKS_URI=${COGNITO_JWKS_URI}
    depends_on:
      - db
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    networks:
      - pgnetwork

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    #commented out for production
    networks:
      - pgnetwork
  #TODO IMPORTANT return this when we want to containerise the front end for deployment

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - pgnetwork

  # judge0:
  #   image: judge0/judge0:latest
  #   ports:
  #     - "2358:2358"
  #   privileged: true
  #TODO IMPORTANT return this when we want to start implementing code execution


  redis:
    image: redis:8.6.3-alpine
    container_name: codeclash-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
      - ./backend/src/config/redis.conf:/etc/redis/redis.conf
    command: ["redis-server", "/etc/redis/redis.conf"]
    restart: unless-stopped
    networks:
      - pgnetwork

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
      PGADMIN_LISTEN_PORT: ${PGADMIN_PORT}
    ports:
      - "${PGADMIN_PORT}:5151"
    volumes: 
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - pgnetwork

volumes:
  postgres_data:
  pgadmin_data:
  redis-data:
    driver: local

networks:
  pgnetwork:
  
