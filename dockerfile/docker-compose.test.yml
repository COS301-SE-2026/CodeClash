services:
  backend:
    build: ../backend
    ports:
      - "3001:3000"
    environment: #Copied from deployment branch
      - DB_HOST=${DB_TEST_HOST}
      - DB_PORT=${DB_TEST_PORT}
      - DB_USER=${DB_TEST_USER}
      - DB_PASSWORD=${DB_TEST_PASSWORD}
      - DB_NAME=${DB_TEST_NAME}
      - REDIS_URL=${REDIS_TEST_URL}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - COGNITO_REGION=${COGNITO_REGION}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - COGNITO_JWKS_URI=${COGNITO_JWKS_URI} 
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - pgnetwork


  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_TEST_USER}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD}
      POSTGRES_DB: ${DB_TEST_NAME}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_TEST_USER} -d ${DB_TEST_NAME}"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - pgnetwork

  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    environment:
      - REDIS_URL=${REDIS_TEST_URL}
    networks:
      - pgnetwork


volumes:
  postgres_data:

networks:
  pgnetwork: