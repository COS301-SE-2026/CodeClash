name: Deploy to EC2

on: 
  push: 
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8c3f20df09ac63af7b3ae3d7c91f105f857d8497
        with: 
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ${{secrets.COGNITO_REGION}}
      
      - name: Build and push images
        env: 
          REGISTRY: ${{secrets.ECR_REGISTRY}}
          VITE_COGNITO_USER_POOL_ID: ${{secrets.VITE_COGNITO_USER_POOL_ID}}
          VITE_COGNITO_CLIENT_ID: ${{secrets.VITE_COGNITO_CLIENT_ID}}
          VITE_API_URL: ${{secrets.VITE_API_URL}}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          for svc in backend frontend; do
            docker build \
              --build-arg VITE_COGNITO_USER_POOL_ID="$VITE_COGNITO_USER_POOL_ID" \
              --build-arg VITE_COGNITO_CLIENT_ID="$VITE_COGNITO_CLIENT_ID" \
              --build-arg VITE_API_URL="$VITE_API_URL" \
              -t "$REGISTRY/codeclash-$svc:$GITHUB_SHA" \
              "./$svc"
            docker push "$REGISTRY/codeclash-$svc:$GITHUB_SHA"
          done

  deploy:
    runs-on: ubuntu-latest
    steps: 
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8c3f20df09ac63af7b3ae3d7c91f105f857d8497
        with: 
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ${{secrets.COGNITO_REGION}}

      - name: Deploy via SSM
        env: 
          AWS_INSTANCE_ID: ${{secrets.AWS_INSTANCE_ID}}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu bash /home/ubuntu/deploy.sh main"]' \
            --query "Command.CommandId" \
            --output text
          )

          sleep 3
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$AWS_INSTANCE_ID" \
              --query "Status" \
              --output text
            )

            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "--- Deploy output ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$AWS_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text

              echo "--- Deploy errors ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$AWS_INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
                exit 1
            fi
            sleep 5
          done

          echo "Timed out waiting for deploy to finish"
          exit 1
